[build]
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/mpps-mcq-tester run build"
  publish = "artifacts/mpps-mcq-tester/dist"

[build.environment]
  PNPM_VERSION = "10"
  NODE_VERSION = "20"
  CI = "false"

# ── SPA fallback: all routes serve index.html ──────────────────────────────
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# ── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
